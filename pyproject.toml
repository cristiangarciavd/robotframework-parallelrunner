[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "robotframework-parallelrunner"
# Single source of truth for the version: bump with `poetry version patch|minor|major`.
# ParallelRunner.__version__ / ROBOT_LIBRARY_VERSION read it back from the installed metadata.
version = "0.2.1"
description = "Run a keyword in parallel inside a single Robot Framework test case, with one clean, ordered log.html."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Cristian Garcia", email = "cristian.garcia.vd@gmail.com" },
]
keywords = [
    "robotframework",
    "robot-framework",
    "parallel",
    "threading",
    "testing",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "robotframework>=5.0",
]

[project.optional-dependencies]
# Optional, opt-in only: powers examples/playwright_ui/, not part of CI.
# See examples/playwright_ui/README.md - also run `playwright install chromium` after installing.
playwright-example = [
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/cristiangarciavd/robotframework-parallelrunner"
Documentation = "https://cristiangarciavd.github.io/robotframework-parallelrunner/ParallelRunner.html"
Repository = "https://github.com/cristiangarciavd/robotframework-parallelrunner"
Issues = "https://github.com/cristiangarciavd/robotframework-parallelrunner/issues"
Changelog = "https://github.com/cristiangarciavd/robotframework-parallelrunner/blob/main/CHANGELOG.md"

[tool.poetry]
# Distribution name (pip install robotframework-parallelrunner) differs from
# the import name (Library    ParallelRunner), so the packages are listed explicitly.
# `parallelrunner` is a deprecated single-file shim for the old import path.
packages = [
    { include = "ParallelRunner", from = "src" },
    { include = "parallelrunner.py", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
coverage = ">=7.0"
invoke = ">=2.0"
# Used by the example libraries the acceptance tests run against (examples/).
requests = ">=2.25"
# Used by `invoke demo-pabot` (examples/pabot_demo/); not needed by the library itself.
robotframework-pabot = ">=4.0"

[tool.pytest.ini_options]
testpaths = ["utest"]
pythonpath = ["src", "."]
