[build-system]
# >=77.0.1 is a hard requirement, not a preference: that's the exact setuptools
# version that added support for `license = "MIT"` (PEP 639 SPDX string form)
# below. Anything older raises "invalid pyproject.toml config: `project.license`"
# at build time - confirmed via bisection (76.1.0 rejects it, 77.0.1 accepts it).
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-parallelrunner"
version = "0.1.0"
description = "Thread-based parallel execution of a keyword/method inside a single Robot Framework test case, with clean log.html output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# setuptools >=77.0.1 is required to build this project (see [build-system]
# above), and setuptools dropped Python 3.8 support at 76.0.0 - so 3.8 cannot
# satisfy both constraints at once. Confirmed by reproducing the install
# failure in a clean python:3.8-slim container; python:3.9-slim installs and
# passes the full test suite cleanly. See notes/PUBLISHING_GUIDE.md.
requires-python = ">=3.9"
authors = [
    { name = "Cristian Garcia", email = "cristian.garcia.vd@gmail.com" },
]
keywords = [
    "robotframework",
    "robot-framework",
    "parallel",
    "threading",
    "testing",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "robotframework>=5.0",
]

[project.optional-dependencies]
dev = [
    "robotframework",
    "build",
    "requests",
]
# Optional, opt-in only: powers examples/playwright_ui/, not part of `dev` or CI.
# See examples/playwright_ui/README.md - also run `playwright install chromium` after installing.
playwright-example = [
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/cristiangarcia/robotframework-parallelrunner"
Documentation = "https://github.com/cristiangarcia/robotframework-parallelrunner/tree/main/docs"
Repository = "https://github.com/cristiangarcia/robotframework-parallelrunner"
Changelog = "https://github.com/cristiangarcia/robotframework-parallelrunner/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parallelrunner = ["py.typed"]
