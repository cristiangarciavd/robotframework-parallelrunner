name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  tests:
    # ubuntu-latest (26.04) has no Python 3.9 build for setup-python any more;
    # 3.9 runs on 24.04 for as long as the library supports it.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install project and dev dependencies
        run: |
          poetry env use python
          poetry install --no-interaction

      - name: Unit tests
        run: poetry run invoke utest

      - name: Acceptance tests
        run: poetry run invoke atest

      - name: Keyword documentation builds
        run: poetry run invoke libdoc

      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-results-${{ matrix.python-version }}
          path: robot_results/
          retention-days: 14
